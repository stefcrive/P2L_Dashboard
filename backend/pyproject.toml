[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irms-backend"
version = "1.0.0"
description = "IRMS Output Analyzer Backend API"
authors = [
    {name = "IRMS Team", email = "team@irms.com"}
]
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "numpy>=1.25.2",
    "pandas>=2.1.4",
    "scipy>=1.11.4",
    "matplotlib>=3.8.2",
    "plotly>=5.17.0",
    "pydantic>=2.5.2",
    "pydantic-settings>=2.1.0",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "celery>=5.3.4",
    "redis>=5.0.1",
    "httpx>=0.25.2",
    "python-dotenv>=1.0.0"
]
requires-python = ">=3.9"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.8.0"
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true